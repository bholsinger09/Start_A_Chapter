<!DOCTYPE html>
<html>
<head>
    <title>API Test Page</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h2>API Test Page</h2>
    <button onclick="testRegistration()">Test Registration API</button>
    <div id="result"></div>

    <script>
        async function testRegistration() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            // Use a unique username each time
            const timestamp = Date.now();
            const uniqueUsername = `testuser${timestamp}`;
            
            try {
                const response = await axios.post('/api/auth/register', {
                    firstName: 'TestJS',
                    lastName: 'User',
                    email: `test${timestamp}@example.com`,
                    username: uniqueUsername,
                    password: 'TestPass123!',
                    role: 'MEMBER'
                });
                
                resultDiv.innerHTML = `
                    <h3 style="color: green;">SUCCESS! 🎉</h3>
                    <p>Registration API is working perfectly!</p>
                    <pre>${JSON.stringify(response.data, null, 2)}</pre>
                `;
                console.log('✅ Success:', response.data);
            } catch (error) {
                if (error.response?.status === 400) {
                    resultDiv.innerHTML = `
                        <h3 style="color: orange;">API Working - Validation Error</h3>
                        <p>The API is working correctly and returned a validation error:</p>
                        <p><strong>${error.response.data.message}</strong></p>
                        <p>This is expected behavior when trying to register with existing data.</p>
                        <pre>${JSON.stringify(error.response.data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 style="color: red;">ERROR!</h3>
                        <p>Status: ${error.response?.status || 'Unknown'}</p>
                        <p>Message: ${error.message}</p>
                        <pre>${JSON.stringify(error.response?.data || error, null, 2)}</pre>
                    `;
                }
                console.error('❌ Error:', error);
            }
        }
    </script>
</body>
</html>
