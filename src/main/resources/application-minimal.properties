# Minimal Profile - No data loading
spring.application.name=Campus Chapter Organizer

# H2 Database Configuration (in-memory, no persistence)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration - create tables only
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable all data initialization
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Disable H2 console for security
spring.h2.console.enabled=false

# Minimal logging
logging.level.root=WARN
logging.level.com.turningpoint=INFO
logging.level.org.springframework.boot=WARN

# Server Configuration
server.port=8080