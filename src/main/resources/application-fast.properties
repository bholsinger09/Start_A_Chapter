# Test Profile - Faster Startup
spring.application.name=Campus Chapter Organizer

# H2 Database Configuration (for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration - Minimal logging
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for development)
spring.h2.console.enabled=true

# Server Configuration
server.port=8081

# Minimal logging for faster startup
logging.level.root=WARN
logging.level.com.turningpoint.chapterorganizer=INFO