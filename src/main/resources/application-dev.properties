# Development Profile - Fast startup without sample data
spring.application.name=Campus Chapter Organizer

# H2 Database Configuration (for development)
spring.datasource.url=jdbc:h2:mem:chapterdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable data initialization for faster startup
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging - Minimal for faster startup
logging.level.com.turningpoint.chapterorganizer=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN
logging.level.org.apache=WARN

# Server Configuration
server.port=8080
