# QA Profile Configuration
spring.application.name=Campus Chapter Organizer

# H2 Database Configuration (persistent for QA)
spring.datasource.url=jdbc:h2:file:./data/chapterdb_v2;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (disabled for QA)
spring.h2.console.enabled=false

# Logging (reduced for QA)
logging.level.com.turningpoint.chapterorganizer=INFO
logging.level.org.hibernate.SQL=WARN

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=https://startachapter.duckdns.org,http://startachapter.duckdns.org
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
