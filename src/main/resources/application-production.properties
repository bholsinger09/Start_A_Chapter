# Production Profile Configuration
spring.application.name=Campus Chapter Organizer

# PostgreSQL Database Configuration (for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:chapter-db}:${DB_PORT:5432}/${DB_NAME:chapter_organizer_prod}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campus_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Flyway Migration (optional for production)
spring.flyway.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=true

# Logging
logging.level.com.turningpoint.chapterorganizer=INFO
logging.level.org.hibernate.SQL=WARN

# Server Configuration
server.port=${PORT:8080}